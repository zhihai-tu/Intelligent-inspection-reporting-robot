# 智能巡检举报下架机器人配置文件

# 应用配置
app:
  name: "智能巡检举报机器人"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  debug: true

# 数据库配置
database:
  url: "sqlite:///./data/database.db"
  echo: false

# AI模型配置
ai:
  # 使用OpenAI兼容API进行内容分析
  provider: "openai"  # 可选: openai, anthropic
  model: "gpt-4-vision-preview"
  api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
  base_url: ""  # 自定义API端点（可选）
  
  # 黑灰产识别关键词
  blacklist_keywords:
    - "加微信"
    - "私聊"
    - "导流"
    - "贷款"
    - "刷单"
    - "兼职"
    - "赚钱"
    - "返现"
    - "免费领"
    - "薅羊毛"
  
  # 风险等级阈值
  risk_threshold:
    high: 0.8    # 高风险：立即举报
    medium: 0.5  # 中风险：人工审核
    low: 0.3     # 低风险：监控

# 爬虫配置
crawler:
  # 抖音平台配置
  douyin:
    enabled: true
    search_keywords:
      - "贷款"
      - "刷单兼职"
      - "免费领取"
      - "加微信"
    max_videos_per_keyword: 50
    crawl_interval: 3600  # 爬取间隔（秒）
  
  # 快手平台配置（预留）
  kuaishou:
    enabled: false
  
  # 小红书平台配置（预留）
  xiaohongshu:
    enabled: false
  
  # 通用配置
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 30
  retry_times: 3
  delay_range: [2, 5]  # 随机延迟范围（秒）

# 举报配置
reporter:
  # 举报原因模板
  report_reasons:
    - "涉嫌诈骗引流"
    - "违规广告导流"
    - "疑似黑灰产内容"
    - "不良信息传播"
  
  # 举报间隔（避免被识别为机器人）
  report_interval: 10  # 秒
  max_reports_per_hour: 100
  
  # 下架状态检查
  check_takedown_interval: 1800  # 30分钟检查一次
  max_check_times: 48  # 最多检查48次（24小时）

# 调度器配置
scheduler:
  # 定时任务配置
  tasks:
    - name: "video_crawl_task"
      cron: "0 */2 * * *"  # 每2小时执行一次
      enabled: true
    
    - name: "ai_analysis_task"
      cron: "*/30 * * * *"  # 每30分钟执行一次
      enabled: true
    
    - name: "auto_report_task"
      cron: "*/15 * * * *"  # 每15分钟执行一次
      enabled: true
    
    - name: "status_check_task"
      cron: "0 * * * *"  # 每小时执行一次
      enabled: true
    
    - name: "daily_report_task"
      cron: "0 9 * * *"  # 每天9点生成报表
      enabled: true

# 日志配置
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan> - <level>{message}</level>"
  rotation: "100 MB"
  retention: "30 days"
  path: "./data/logs/app.log"

# 数据报表配置
report:
  export_format: "excel"  # excel, csv, json
  output_path: "./data/reports/"
  include_fields:
    - "video_id"
    - "video_title"
    - "platform"
    - "channel"
    - "author"
    - "detected_time"
    - "risk_level"
    - "risk_score"
    - "reported_time"
    - "report_status"
    - "takedown_time"
    - "process_duration"
